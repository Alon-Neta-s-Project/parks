# איסוף צוות 1 — השליפה רצה כאן, לא בסוכן
#
# 🔴 **הסיבה היחידה שהקובץ הזה קיים היא הפרדת ה-credential מהסוכן.**
#
# סוכן-האיסוף קורא תוכן חיצוני לא מהימן. סוכן כזה שמחזיק גם מפתח API
# הוא שני דברים שאסור שייפגשו. הטוקן חי כאן, בשלב אחד, והסוכן מתחיל
# מהקובץ שנכתב — מקבל פלט, לא הרשאה.
#
# ⛔ **ואין כאן שום הרצה של סוכן.** ה-workflow שולף וכותב, וזהו.
# הפייפליין (שוער → מסדר → מוודא) רץ בסשן נפרד שאין בו הטוקן.
#
# ⛔ **ואין כאן כתיבה למסד.** הסיסמה של team1_content אינה בקובץ הזה
# ולא בשום שלב בו.

name: איסוף צוות 1

on:
  workflow_dispatch:
    inputs:
      max_items:
        description: "תקרת פריטים להרצה (ברירת מחדל 200)"
        required: false
        default: "200"

# ⚠️ **ברירת מחדל: אין הרשאות.** השלב היחיד שצריך כתיבה מבקש אותה
# במפורש. בלי זה ל-GITHUB_TOKEN יש כתיבה לכל הריפו כברירת מחדל.
permissions: {}

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # 🔴 **הסוד יושב על השלב, לא על ה-job.** env ברמת job היה מעמיד
      # את הטוקן בכל שלב אחר כאן — כולל שלבים שיתווספו בעתיד בלי
      # שמישהו יחשוב על זה שוב.
      - name: שליפה מ-Apify
        env:
          APIFY_TOKEN: ${{ secrets.APIFY_TOKEN }}
          TEAM1_MAX_ITEMS: ${{ inputs.max_items }}
        run: bash scripts/team1-fetch.sh

      # ⚠️ משלב זה ואילך אין APIFY_TOKEN בסביבה.
      - name: מה נשלף
        run: |
          ls -la data/team1-inbox/
          echo "— התוכן עצמו אינו מודפס ללוג: הוא טקסט חיצוני לא מהימן,"
          echo "  ולוג Actions נקרא בידי אדם ובידי כלים."

      # ⚠️ **ארטיפקט, לא commit.** raw_content הוא קלט גולמי לא מסונן;
      # הוא אינו נכנס לריפו לפני שוער-התוכן. הארטיפקט הוא מה שהסוכן
      # מוריד ומתחיל ממנו.
      - name: העלאת הקלט הגולמי
        uses: actions/upload-artifact@v4
        with:
          name: team1-raw-${{ github.run_id }}
          path: data/team1-inbox/
          retention-days: 7
