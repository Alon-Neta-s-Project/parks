# שינוי בקובץ workflow — דיווח מיידי לגיא, מכל ענף
#
# 🔴 **דרישת גיא (25.09), עם מתן גישת Collaborator לאלון.**
#
# נטע הכריעה לתת לאלון Write ולעבוד בענף נפרד. גיא הבהיר — ובצדק —
# ש**ענף נפרד אינו סוגר את הסיכון**: Actions מריץ workflow מכל ענף
# שדוחפים אליו, עם גישה מלאה ל-Secrets ברמת הרפו. כלומר מי שיכול
# לדחוף ענף יכול לדחוף קובץ שמדפיס אותם.
#
# ⚠️ **ומה זה אינו.** זו התראה, לא מניעה. הקובץ כבר רץ עד שההתראה
# נפתחת. מה שזה כן נותן: שהדבר לא יקרה **בשקט**, וזו בדיוק הדרישה
# של גיא — דיווח מיידי, ולא סבב סקירה תקופתי.
#
# 🔴 **והמגבלה שחייבת להיאמר.** ה-workflow שרץ על דחיפה הוא זה
# שבענף שנדחף. ענף שמוחק את הקובץ הזה או משנה אותו לא ידווח על
# עצמו. ההגנה האמיתית היא הגנת ענף על `release`, שמונעת מיזוג
# בלי סקירה — לא הקובץ הזה.

name: מעקב אחרי workflows

on:
  push:
    paths:
      - ".github/workflows/**"

permissions:
  contents: read
  issues: write

jobs:
  report:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # ⚠️ שני commits, כדי שאפשר יהיה להשוות מול הקודם.
          fetch-depth: 2

      - name: פתיחת Issue לגיא
        env:
          GH_TOKEN: ${{ github.token }}
          ACTOR: ${{ github.actor }}
          BRANCH: ${{ github.ref_name }}
          SHA: ${{ github.sha }}
          REPO: ${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          # ⚠️ **רשימת הקבצים, ולא רק "משהו השתנה".** גיא צריך לדעת
          # מה נגעו בו כדי להחליט אם זה דורש פעולה.
          files=$(git diff --name-status HEAD^ HEAD -- .github/workflows/ 2>/dev/null || echo "?  (אין commit קודם)")

          # 🔴 **דיווח ריק אינו דיווח.** אם ההשוואה לא החזירה דבר,
          # זה עצמו ממצא — לא סיבה לסיים בשקט.
          if [ -z "$files" ]; then
            files="⚠️ ההשוואה מול ה-commit הקודם לא החזירה שינוי. ייתכן force-push או מיזוג."
          fi

          # ⚠️ **הגוף נבנה לקובץ ולא ב-heredoc בתוך ה-YAML.** heredoc
          # דורש שורות לא מוזחות, וה-YAML דורש הזחה — השילוב שבר את
          # הקובץ בשקט עד שבדקתי אותו בפרסר.
          {
            echo "## מה קרה"
            echo
            echo "קובץ תחת \`.github/workflows/\` השתנה ונדחף."
            echo
            echo "| | |"
            echo "|---|---|"
            echo "| ענף | \`$BRANCH\` |"
            echo "| מי דחף | \`$ACTOR\` |"
            echo "| commit | \`$SHA\` |"
            echo "| הריצה | $RUN_URL |"
            echo
            echo "## הקבצים"
            echo
            echo '```'
            echo "$files"
            echo '```'
            echo
            echo "## למה זה נפתח אוטומטית"
            echo
            echo "🔴 **Actions מריץ workflow מכל ענף, עם גישה מלאה ל-Secrets ברמת הרפו** — בלי קשר לענף. כלומר מי שיכול לדחוף ענף יכול לדחוף קובץ שקורא אותם. דרישת גיא, 25.09, עם מתן גישת Collaborator לאלון."
            echo
            echo "⚠️ **וזו התראה, לא מניעה.** הקובץ כבר רץ עד שה-Issue הזה נפתח."
            echo
            echo "## מה לעשות"
            echo
            echo "גיא בודק את הדיף. אם השינוי מוכר — לסגור עם הנימוק. אם לא — **לסובב את הסודות שהקובץ נוגע בהם מיד.**"
            echo
            echo "---"
            echo "_Generated by [Claude Code](https://claude.ai/code)_"
          } > body.md

          gh issue create \
            --repo "$REPO" \
            --title "קובץ workflow השתנה בענף $BRANCH — בידי $ACTOR" \
            --label "אבטחה" --label "חוסם: גיא" \
            --body-file body.md
