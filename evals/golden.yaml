  # ── המקרה ה-16, שנחסם ונפתח (07.09) ────────────────────────────────
  # רוני אימתה מול העמוד הרשמי, פולה כתבה מחדש, והתוכן ב-
  # knowledge/lightning-lane-multi-pass-wdw.md נושא עכשיו את המספרים.
  - id: ll-booking-window-hotel-guest
    kind: retrieval
    ask: >-
      מתי אני יכול/ה להזמין בפועל את חלון-הזמן למתקן עם Lightning Lane,
      אם אני ישן/ה במלון דיסני?
    expect:
      chunks_gt: 0
      # ⚠️ "7" ולא "שבוע". המקור אומר 7 ימים, וטים אינו אמור לתרגם
      # מספר למילה.
      #
      # ⚠️ ו-"3" הוסר מכאן אחרי המדידה. השאלה היא על אורח מלון, וכלל
      # שלושת הימים חל על מי שאינו במלון — דרישה שהוא יזכיר אותו היא
      # דרישה שיענה על מה שלא נשאל. זו אותה טעות שעשיתי בבדיקת
      # הפרסונה, ששם דרשתי שם פארק בשאלה על גובה. ההשוואה בין השניים
      # נבדקת במקרה שאחריו, ששואל את השאלה הכללית.
      must_contain: ["7", "14"]
      tiers: ["T1"]
    tags: [rules, purchase]
    status: pass
    measured: 2026-09-07
    note: >-
      נמדד: chunks: 5, והתשובה נשאה "עד 7 ימים לפני יום ההגעה למלון",
      "7:00 בבוקר לפי שעון מזרח" ו"מכסה את כל ימי השהות שלך, עד 14
      ימים" — כלומר שלושת הפרטים החדשים עברו מהתוכן אל התשובה.

  # ⚠️ המקרה שנועל את ההבחנה עצמה. פולה ורוני הדגישו ששני המספרים
  # ביחד הם מה שמשנה איך משפחה מתכננת, ולכן צריך מקרה שבו שניהם
  # חייבים להופיע — והוא חייב לשאול את השאלה הכללית, לא את זו שנוגעת
  # לאורחי מלון בלבד.
  - id: ll-booking-window-both-rules
    kind: retrieval
    ask: "מתי נפתחת ההזמנה של Lightning Lane Multi Pass?"
    expect:
      chunks_gt: 0
      must_contain: ["7", "3"]
      tiers: ["T1"]
    tags: [rules, purchase]
    status: unmeasured

