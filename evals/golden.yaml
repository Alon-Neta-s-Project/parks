# evals/golden.yaml — סט הזהב
#
# ⚠️ **שני סוגי מקרים, ואסור לערבב ביניהם.**
#
#   kind: retrieval  — שליפה סמנטית ממאגר הידע. נמדדת ב-recall@5, וזה
#                      השער של M4 (docs/park-day-companion-tim-build-plan.md).
#   kind: tool       — קריאה לכלי שמחזיר עובדות מהטבלה. **דטרמיניסטית.**
#                      לא recall@5 — או שהשורה הנכונה חזרה או שלא.
#
# מקרה שנכשל כאן אינו בהכרח באג בקוד. עמודת `gap` אומרת של מי זה:
#   code    — הקוד. קודי מטפל.
#   content — התוכן (שם נרדף חסר, ניסוח). פולה מחליטה.
#
# ⚠️ **המקרים שמסומנים `measured` נמדדו מול 232 השורות במסד אמיתי**,
# ולא נוסחו מהראש. תאריך המדידה בשדה. מקרה בלי `measured` הוא מקרה
# שנוסח ועוד לא רץ — הוא בסט כדי שלא יישכח, ואינו ראיה לכלום.
#
# ── אוצר המילים של `expect` (אושר על ידי פולה, 07.09) ────────────────
#
#   ride          שם המתקן שחייב לחזור. השוואה מדויקת לשם האנגלי.
#   rides         מספר שורות המתקן **בדיוק**. `rides: 0` הוא הדרישה
#                 שלא תחזור אף שורה.
#   rides_gt      מספר שורות המתקן חייב להיות **גדול מ**. `rides_gt: 0`
#                 = "נשלף לפחות מתקן אחד".
#   chunks_gt     אותו דבר לקטעי הידע.
#   height_cm     מגבלת הגובה שחייבת להיאמר.
#   fits          האם הקבוצה עוברת את המגבלה.
#   must_contain  מחרוזות שחייבות להופיע **בטקסט התשובה**.
#   must_not_contain  מחרוזות שאסור שיופיעו.
#   must_not_match  ביטוי רגולרי שאסור שיימצא בתשובה.
#                 ⚠️ נוסף ב-07.09 מפני ש-must_not_contain אינו מספיק
#                 בעברית. הוא תופס רצף אותיות, ורצף אותיות בעברית הוא
#                 לרוב חלק ממילה אחרת: "כן" יושב בתוך "לכן", ו"בשעה"
#                 בתוך "בשעה שמפורסמת באפליקציה". שתי בדיקות אמיתיות
#                 נפלו על זה, ובשתיהן מה שרצינו לאסור אינו מחרוזת אלא
#                 **תבנית** — ספרה, או מילה בפתח משפט.
#   tiers         דרגות הסמכות שחייבות לחזור בשדה `tiers` של התשובה.
#                 ⚠️ לבדיקה בלבד. הדרגה **אינה** נכנסת להקשר של המודל
#                 ואינה מוצגת למשתמשת — ייחוס למקור אסור בממשק.
#   must_ask_clarifying  שטים שאל ולא ענה עובדתית. שלוש בדיקות
#                 דטרמיניסטיות יחד: התשובה מסתיימת בסימן שאלה,
#                 rides: 0, ו-chunks: 0. אין מודל־כשופט.
#   max_words     תקרת אורך לתשובה. תשובה ארוכה אינה שגויה, אבל היא
#                 נקראת פחות — ומשפחה שמפסיקה לקרוא בפסקה השנייה
#                 מפספסת את הסייג שנמצא בשלישית.
#   should_refuse האם סירוב הוא התשובה הנכונה. `false` אומר במפורש
#                 שטים **אמור** לענות — מקרה ייעוץ ולא מקרה עובדה.
#
# ובשדה `tags` — לאיזו משפחה המקרה שייך. לסינון, לא לבדיקה.
#
# ⚠️ **למה `rides_gt` ולא `must_call_tool`.** טים אינו בוחר כלים — הקוד
# קורא לשניהם בכל שאלה. לכן "האם נקרא הכלי" אינו ניתן לבדיקה כפי
# שנוסח, אבל התוצאה כן: התשובה מחזירה `rides` ו-`chunks`. זו בדיקה
# חזקה יותר, כי היא בודקת שהנתון **הגיע** ולא שקריאה נעשתה.
#
# ⚠️ **ו-`must_not_contain` תופס מילה, לא משמעות.** `["מובטח"]` ייפול על
# "לא מובטח". להשתמש בו רק למילים שאין להן צורת היפוך; אחרת לנסח את
# הבדיקה על מה שכן חייב להופיע.

version: 1

cases:
  # ── עובדות על מתקנים ────────────────────────────────────────────────
  # 🔴 המקרה שגילה את הבאג של 029. הוא נשאר בסט לנצח.
  - id: ride.everest.height
    kind: tool
    ask: "הבת שלי בגובה 112 סנטימטר, היא יכולה לעלות על אקספדישן אוורסט?"
    expect:
      ride: "Expedition Everest – Legend of the Forbidden Mountain"
      height_cm: 112
      fits: true
    status: pass
    measured: 2026-09-06
    note: >-
      השאלה שהחזירה "אין לי את המידע" לפני מיגרציה 030. החיפוש התאים
      ביטוי, והשאלה היא משפט.

  - id: ride.space-mountain.exact
    kind: tool
    ask: "כדאי ללכת לספייס מאונטיין?"
    expect: { ride: "Space Mountain" }
    status: pass
    measured: 2026-09-06

  # ── פערי תוכן, לא פערי קוד ─────────────────────────────────────────
  - id: ride.space-mountain.short-spelling
    kind: tool
    ask: "כמה זמן התור לספייס מאונטן?"
    expect: { ride: "Space Mountain" }
    status: partial
    gap: content
    owner: paula
    measured: 2026-09-06
    note: >-
      ⚠️ חוזרות חמש שורות מהמשפחה (Space Mountain, Spaceship Earth,
      Mission SPACE ועוד) כי במסד הכתיב "מאונטיין" והמשפחה כתבה
      "מאונטן". אות אחת. הנכונה ברשימה, אבל טים מקבל ארבעה מתקנים
      מיותרים בהקשר. **שם נרדף אחד סוגר את זה.**

  - id: ride.everest.descriptive-hebrew
    kind: tool
    ask: "מה גובה המינימום במסע אל ההר האסור?"
    expect: { ride: "Expedition Everest – Legend of the Forbidden Mountain" }
    status: fail
    gap: content
    owner: paula
    measured: 2026-09-06
    note: >-
      ⚠️ אפס שורות. "Legend of the Forbidden Mountain" מתורגם, וזה
      ניסוח שמשפחה ישראלית אומרת. אינו באליאסים.

  - id: ride.velocicoaster.spelling
    kind: tool
    ask: "ולוצירפטור מתאים לילד בן 10?"
    expect: { ride: "Jurassic World VelociCoaster" }
    status: fail
    gap: content
    owner: paula
    measured: 2026-09-06
    note: >-
      ⚠️ אפס שורות. במסד "ולוסיקוסטר" (ס), והכתיב הנפוץ הוא בצ׳.

  # ── מה שחייב להחזיר אפס ─────────────────────────────────────────────
  # ⚠️ שורת מתקן שנכנסת להקשר על שאלה שאינה על מתקן היא עובדה זרה
  # שטים עלול לענות עליה. אפס הוא התשובה הנכונה, לא כישלון.
  - id: ride.none.weather
    kind: tool
    ask: "מה קורה אם יורד גשם?"
    expect: { rides: 0 }
    status: pass
    measured: 2026-09-06

  - id: ride.none.greeting
    kind: tool
    ask: "שלום, מה שלומך?"
    expect: { rides: 0 }
    status: pass
    measured: 2026-09-06

  # ── פרסונה: שמות מותג נשארים באנגלית ────────────────────────────────
  # ⚠️ הכרעת פולה מ-07.09, ונכנסה ל-system prompt. הבדיקה היא על טקסט
  # התשובה ולא על השליפה — השליפה כבר מכוסה ב-ride.everest.height.
  - id: persona.brand-names-stay-english
    kind: tool
    ask: "מה מגבלת הגובה באקספדישן אוורסט?"
    expect:
      ride: "Expedition Everest – Legend of the Forbidden Mountain"
      rides_gt: 0
      height_cm: 112
      # ⚠️ שם הפארק היה כאן ונמחק. הוא לא הופיע בתשובה — ובצדק: השאלה
      # היא על גובה, וטים ענה בדיוק את מה שנשאל. הבדיקה דרשה ממנו
      # לפטפט, וזה כשל שלי ולא שלו. שם המתקן באנגלית מוכיח את הכלל.
      must_contain:
        - "Expedition Everest"
        - "112"
      # ⚠️ לשלושתן אין צורת היפוך, ולכן הן בטוחות ל-must_not_contain.
      must_not_contain:
        - "ממלכת החיות"
        - "משלחת אוורסט"
        - "ההר האסור"
    status: pass
    measured: 2026-09-07
    note: >-
      בדיקת ה-Deploy של הפרסונה. rides: 1, והתשובה "מגבלת הגובה למתקן
      Expedition Everest – Legend of the Forbidden Mountain היא 112
      ס\"מ" — השם באנגלית, המספר מהמאגר, אפס תרגום.

  # ── שמונת מפגשי הדמויות — השם העברי שנטען ב-07.09 ──────────────────
  # 🔴 לפני הטעינה השאלה הזו החזירה אפס שורות, וטים אמר "אין לי את
  # המידע" — על שורה שקיימת. זה המקרה שנועל את התיקון.
  - id: ride.moana-meet.hebrew-name
    kind: tool
    ask: "איפה אפשר לפגוש את מואנה?"
    expect:
      ride: "Meet Moana at Character Landing"
      rides_gt: 0
      # ⚠️ הסטטוס במאסטר הוא "אינו קבוע" (הכרעת פולה, 06.09), ולכן
      # תשובה שאינה מסייגת אותו היא כישלון גם אם השורה נמצאה.
      must_contain:
        - "Character Landing"
      # 🔴 נוסף אחרי המדידה. הריצה הראשונה החזירה "אינו פתוח כרגע" על
      # שורה שמשמעותה "אין לוח קבוע" — ראה status.not-open-is-not-closed.
      must_not_contain:
        - "אינו פתוח"
    status: pass
    measured: 2026-09-07
    note: >-
      🔴 לפני טעינת השם העברי השאלה החזירה אפס שורות. במדידה: rides: 4,
      והשורה נמצאה. ⚠️ תשובה שמזכירה גם את Journey of Water, Inspired
      by Moana אינה כישלון — יש בשמו "מואנה" והוא פתוח.

  # ── "משתנה" אינו "סגור" ─────────────────────────────────────────────
  # 🔴 נמצא במדידה של ride.moana-meet.hebrew-name, 07.09. הפורמטר אמר
  # "אינו פתוח כרגע" על כל מה שאינו open — שלושה סטטוסים שונים במשפט
  # אחד. temporarily_closed על Meet Moana הוא הכרעת פולה שמשמעותה "אי
  # אפשר לסמוך על נוכחות הדמות", ומשפחה שקוראת "אינו פתוח" מוחקת אותו
  # מהיום. אותה תבנית, בכיוון ההפוך: הפעם היא שללה במקום להבטיח.
  - id: status.not-open-is-not-closed
    kind: tool
    ask: "אפשר לפגוש את מואנה באנימל קינגדום?"
    expect:
      ride: "Meet Moana at Character Landing"
      rides_gt: 0
      must_not_contain:
        - "סגור"
        - "אינו פתוח"
    status: pass
    # ⚠️ נמדד על הניסוח "אינו בלוח קבוע". פולה חידדה אותו ל"מתקיים
    # בהתאם ללוח זמנים משתנה" — אותה משמעות, בלי הצליל של העדר. שתי
    # המילים האסורות עדיין אינן בו, אבל המדידה שייכת לניסוח הקודם.
    measured: 2026-09-07
    note: >-
      ⚠️ שתי המילים נבחרו כי אין להן צורת היפוך בהקשר הזה.
      במדידה אחרי התיקון: rides: 6, ואף אחת מהשתיים לא הופיעה. טים כתב
      "אינה בלוח קבוע... חובה לבדוק באפליקציה הרשמית ביום הביקור עצמו"
      — הניסוח החדש הגיע כלשונו. ובנוסף "אין למתקן הזה מגבלת גובה",
      ולא "גובה מינימום 0", שזה הכלל השני שנבדק כאן דרך אגב.

  # ── שליפה סמנטית (M4) ───────────────────────────────────────────────
  # ממתין ל-40–60 מקרים לפי תוכנית הבנייה. המקרים משישה הריאיונות
  # נכנסים כאן.

  # ── סבב 2 של פולה (07.09) — 15 מקרים ───────────────────────────────
  #
  # ⚠️ הגיעו בשמות שדה משלהם (question · must_have · must_cite_tier),
  # ותורגמו לסכמה של הקובץ הזה: ask · expect · tiers. התוכן לא שונה.
  # הסיבה היא הכלל שכבר עלה כאן היום — אותו דבר בשני שמות הוא איך ששם
  # שלישי נולד, ובדיקה שאיש לא יודע להריץ אינה בדיקה.
  #
  # 🔴 המקרה ה-16, ll-booking-window-hotel-guest, **אינו כאן בכוונה.**
  # פולה חסמה אותו עד שרוני מאמתת את המספרים 7/3, כי התוכן
  # ב-knowledge/lightning-lane-multi-pass-wdw.md עדיין מעורפל. מקרה
  # שנמזג לפני שיש לו תשובה נכשל לנצח ונרשם כחוב שאיש לא פורע.
  #
  # כולם unmeasured — נוסחו ועוד לא רצו.

  - id: child-swap-disney-vs-universal
    kind: retrieval
    ask: "איך עובד Child Swap בדיסני וביוניברסל? זה אותו דבר?"
    expect:
      chunks_gt: 0
      must_contain: ["שמירת מקום", "חדר משפחות"]
      tiers: ["T1"]
    tags: [rules, cross-park]
    status: unmeasured

  - id: single-rider-universal-negative
    kind: retrieval
    ask: "יש לי אופציית single rider ביוניברסל?"
    expect:
      must_contain: ["לא", "דיסני"]
      # ⚠️ תבנית ולא מחרוזת, ובכוונה. פולה ביקשה
      # must_not_contain: ["כן"] — והוא היה נכשל על תשובה נכונה, כי
      # "כן" יושב בתוך "לכן", "אכן" ו"מסוכן". מה שרצינו לאסור הוא
      # תשובה שנפתחת ב"כן", וזה מיקום ולא רצף אותיות.
      #
      # 🔴 ו-\b אינו עובד בעברית ב-JavaScript: אות עברית אינה \w, ולכן
      # גבול־מילה אחרי ן לעולם אינו נמצא. נמדד — /^\s*כן\b/ מחזיר false
      # גם על "כן, יש אופציה כזו", כלומר הבדיקה הייתה עוברת בשקט על
      # בדיוק התשובה השגויה שהיא באה לתפוס. Lookahead על טווח האותיות
      # העבריות עובד, ונמדד על ארבעה משפטים.
      must_not_match: '^\s*כן(?![֐-׿])'
      tiers: ["T1"]
    tags: [facts, cross-park]
    status: unmeasured

  - id: ll-tier-attraction-not-included
    kind: tool
    ask: "האם Tron כלול במכסת ה-Multi Pass שלי?"
    expect:
      rides_gt: 0
      must_contain: ["בנפרד", "לא כלול"]
      tiers: ["T1"]
    tags: [rules, purchase]
    status: unmeasured
    note: >-
      ✅ אומת מול הטבלה: TRON Lightcycle / Run נושא Single Pass ו-
      singlePassRequired: true. הציפייה נכונה מול הנתונים.

  - id: severe-weather-closure-refund
    kind: retrieval
    ask: "הפארק נסגר לגמרי בגלל סערה — מובטח לי החזר כספי?"
    expect:
      must_contain: ["לא מובטח"]
      tiers: ["T1"]
    tags: [refunds, uncertainty]
    status: unmeasured
    note: >-
      ✅ מנוסח על מה שכן חייב להופיע ולא כשלילה של "מובטח" — בדיוק
      התיקון שסוכם, כי must_not_contain היה נופל על "לא מובטח" עצמו.

  - id: roaming-characters-expectation
    kind: retrieval
    ask: "אני יכול/ה לפגוש דמויות שמסתובבות חופשי בפארק, לא בתור?"
    expect:
      must_contain: ["תור", "מיקום קבוע"]
    tags: [expectations, characters]
    status: unmeasured

  - id: kosher-strictness-clarify
    kind: retrieval
    ask: "יש אוכל כשר בפארק?"
    expect:
      must_ask_clarifying: true
    tags: [dietary, clarify]
    status: unmeasured

  - id: epic-universe-early-entry-once
    kind: retrieval
    ask: "אני יכול/ה להשתמש בכניסה מוקדמת כל יום בשהות שלי ב-Epic Universe?"
    expect:
      chunks_gt: 0
      must_contain: ["פעם אחת", "כל השהות"]
      tiers: ["T1"]
    tags: [rules, epic-universe]
    status: unmeasured

  - id: third-party-hotel-booking-warning
    kind: retrieval
    ask: "הזמנתי מלון דיסני דרך Booking.com — יש משהו שכדאי לדעת?"
    expect:
      must_contain: ["שיוך", "אפליקציה הרשמית"]
    tags: [advisory, booking]
    status: unmeasured

  - id: gentle-ride-motion-sickness-flag
    kind: tool
    ask: "יש מתקן שנראה רגוע אבל עלול לגרום לי לבחילה?"
    expect:
      rides_gt: 0
      must_contain: ["בחילה", "תנועה"]
    tags: [facts, safety, sensory]
    status: unmeasured
    note: >-
      ✅ אומת מול הטבלה: 24 מתקנים בעוצמה 1–2 נושאים אזהרת בחילה, בהם
      Toy Story Mania! ו-Alien Swirling Saucers. יש למקרה תשובה אמיתית.

  - id: parade-showtime-guided-non-answer
    kind: retrieval
