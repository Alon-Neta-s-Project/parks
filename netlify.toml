# ── Netlify ──────────────────────────────────────────────────────────
#
# האתר הוא קבצים סטטיים בלבד: 253 דפים שנבנים מראש, בלי שרת שמריץ
# משהו. טים, המסד והחיפוש יושבים בסופהבייס ונפרדים לגמרי — ולכן
# האחסון כאן מגיש קבצים ולא מריץ קוד, וזה נכון גם כשיתווספו סליקה,
# מפות וסוכנים.

# ⚠️ הבנייה הראשונה שעולה לאוויר היא **טים בלבד**: מסך אחד שאינו
# מייבא דבר מ-`src/data`, ולכן אפס משורות המתקנים נוסעות לדפדפן.
# ההחלטה על מסכי הרשימות פתוחה, וכל עוד היא פתוחה — הן אינן נבנות.
#
# למעבר לאתר המלא: `npm run build` ו-`publish = "dist"`.
[build]
  command = "npm run build:tim"
  publish = "dist-tim"

[build.environment]
  NODE_VERSION = "22"

# מסך אחד, ולכן כל כתובת מגיעה אליו.
# ⚠️ יעד `tim.html` ולא `index.html`. הבנייה הזו אינה מייצרת index.html
# בכלל, ו-fallback לקובץ שאינו קיים היה מגיש 404 על כל כתובת.
[[redirects]]
  from = "/*"
  to = "/tim.html"
  status = 200
  force = false

# ⚠️ הכותרות למטה אינן קישוט. האתר מדבר עם סופהבייס ועם ג'מיני דרכה,
# ומדיניות תוכן רחבה מדי היא בדיוק מה שהופך דף סטטי לנקודת הזרקה.
[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    # ⚠️ אין לנו iframe ואיננו רוצים שיטמיעו אותנו באחד.
    X-Frame-Options = "DENY"
    # ההרשאות שהדפדפן ייתן לדף. אנחנו לא מבקשים אף אחת מהן היום —
    # וכשגוגל מפות ייכנס, `geolocation` יידרש כאן במפורש. עדיף לפתוח
    # אותו במודע מאשר לגלות שהוא היה פתוח כל הזמן.
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"

# הנכסים נושאים חתימה בשם הקובץ, ולכן אפשר לשמור אותם לנצח.
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# ⚠️ תמונות הפארקים אינן בבנייה הזו כלל (`publicDir: false`) — אין
# להן צרכן במסך אחד. הכלל שמור לכשמסכי הרשימות יעלו.
