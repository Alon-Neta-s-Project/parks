# ── Netlify ──────────────────────────────────────────────────────────
#
# האתר הוא קבצים סטטיים בלבד: 253 דפים שנבנים מראש, בלי שרת שמריץ
# משהו. טים, המסד והחיפוש יושבים בסופהבייס ונפרדים לגמרי — ולכן
# האחסון כאן מגיש קבצים ולא מריץ קוד, וזה נכון גם כשיתווספו סליקה,
# מפות וסוכנים.

# ⚠️ הבנייה הראשונה שעולה לאוויר היא **טים בלבד**: מסך אחד שאינו
# מייבא דבר מ-`src/data`, ולכן אפס משורות המתקנים נוסעות לדפדפן.
# ההחלטה על מסכי הרשימות פתוחה, וכל עוד היא פתוחה — הן אינן נבנות.
#
# למעבר לאתר המלא: `npm run build` ו-`publish = "apps/web/dist"`.
[build]
  command = "npm run build:tim"
  publish = "apps/web/dist-tim"

[build.environment]
  NODE_VERSION = "22"

# ── השרת: apps/server כ-Netlify Function תחת /api/* (O1, הכרעת אלון 26.09) ──
#
# הכניסה היחידה ש-Netlify טוען היא apps/server/netlify/functions/api.ts;
# esbuild אורז אותה עם apps/server/src. הנתיב /api/* נקבע בקובץ עצמו (config.path).
#
# ⚠️ **בענף refactor/server-split בלבד, ולאתר ה-staging.** אתר הייצור בונה
# את `release`, ולכן הבלוק הזה אינו משנה אותו עד מיזוג.
# ⚠️ **O11 פתוח בהחלטת אלון:** `diagnose` מחזיר שמות משתני סביבה. הודעה לגיא נכתבה.
# ⚠️ אחרי הפריסה הראשונה: `curl <אתר>/api/health` חייב להחזיר {"ok":true} ולא את
# tim.html — התיעוד אינו אומר במפורש שנתיב של פונקציה גובר על ההפניה הגורפת למטה.
[functions]
  directory = "apps/server/netlify/functions"
  node_bundler = "esbuild"

# מסך אחד, ולכן כל כתובת מגיעה אליו.
# ⚠️ יעד `tim.html` ולא `index.html`. הבנייה הזו אינה מייצרת index.html
# בכלל, ו-fallback לקובץ שאינו קיים היה מגיש 404 על כל כתובת.
[[redirects]]
  from = "/*"
  to = "/tim.html"
  status = 200
  force = false

# ⚠️ הכותרות למטה אינן קישוט. האתר מדבר עם סופהבייס ועם ג'מיני דרכה,
# ומדיניות תוכן רחבה מדי היא בדיוק מה שהופך דף סטטי לנקודת הזרקה.
[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    # ⚠️ אין לנו iframe ואיננו רוצים שיטמיעו אותנו באחד.
    X-Frame-Options = "DENY"
    # ההרשאות שהדפדפן ייתן לדף. אנחנו לא מבקשים אף אחת מהן היום —
    # וכשגוגל מפות ייכנס, `geolocation` יידרש כאן במפורש. עדיף לפתוח
    # אותו במודע מאשר לגלות שהוא היה פתוח כל הזמן.
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"

# הנכסים נושאים חתימה בשם הקובץ, ולכן אפשר לשמור אותם לנצח.
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# ⚠️ תמונות הפארקים אינן בבנייה הזו כלל: הן ב-src/assets ונכנסות לחבילה רק
# ממה שמייבא אותן (מסך הכניסה), וטים לבדו אינו מייבא. כשהן כן בבנייה, שמן
# נושא גיבוב והן תחת /assets/ — ולכן הכלל למעלה שומר אותן לתמיד.

# ════════════════════════════════════════════════════════════════════
# גרסת הבדיקה — ענף `tim-test`, כתובת נפרדת
# ════════════════════════════════════════════════════════════════════
#
# 🔴 **הדרישה של נטע: שלא יתערבב עם הקיים.** לכן זה לא אתר שני על
# אותו ריפו — `netlify.toml` גובר על הגדרות הממשק, ושני אתרים שקוראים
# את אותו קובץ היו בונים את אותו דבר.
#
# ההקשר הזה חל **רק כשהענף שנבנה נקרא `tim-test`**. ההקשר הציבורי
# למעלה אינו משתנה, ומיזוג הענף הזה ל-`release` אינו יכול לשנות את מה
# שנבנה בפרודקשן — כי שם שם הענף שונה.
#
# ⚠️ ולהפעיל בממשק: Site configuration ← Build & deploy ← Branch
# deploys ← להוסיף את `tim-test`. בלי זה הענף לא נבנה כלל.
# 🔴 **Netlify מכבד `command` ו-`publish` לפי הקשר — אבל לא
# `redirects` ולא `headers`.** הבנייה הראשונה של הענף הוכיחה
# את זה באוויר: ההקשר נבנה והגיש מ-`dist-tim-test`, וההפניה
# שחלה בפועל הייתה הגלובלית שלמעלה — לקובץ שאינו קיים שם.
# כל כתובת החזירה 404.
#
# ⚠️ **ולכן אין כאן בלוק ניתוב להקשר.** הוא נקרא כאילו הוא פועל
# ואינו פועל. במקומו הבנייה מוציאה `index.html` (נמצא לפני
# שההפניה נשקלת) ו-`tim.html` (היעד של הכלל הגלובלי), ב-
# `vite.tim-test.config.ts`. `test-build-separation.test.ts` נופלת אם אחד
# מהם חסר.
#
# ⚠️ **וה-noindex יושב ב-`<meta name="robots">` בתוך הדף.** כותרת
# HTTP לפי הקשר הייתה מתעלמת באותה מידה, ושלושת הדפים
# הם עותקים של אותו קובץ — ולכן כולם נושאים אותה.
[context."tim-test"]
  command = "npm run build:tim-test"
  publish = "apps/web/dist-tim-test"
