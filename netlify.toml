# ── Netlify ──────────────────────────────────────────────────────────
#
# האתר הוא קבצים סטטיים בלבד: 253 דפים שנבנים מראש, בלי שרת שמריץ
# משהו. טים, המסד והחיפוש יושבים בסופהבייס ונפרדים לגמרי — ולכן
# האחסון כאן מגיש קבצים ולא מריץ קוד, וזה נכון גם כשיתווספו סליקה,
# מפות וסוכנים.

[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"

# ⚠️ SPA fallback, ועם חריג אחד שחשוב.
#
# הבנייה מרנדרת מראש 253 דפים אמיתיים — /experience/<id> ו-/park/<name>
# קיימים כקבצים. הכלל הזה תופס רק מה שאין לו קובץ, ומחזיר את index.html
# כדי שהניתוב בצד הלקוח יטפל בו. `force = false` הוא מה שמבטיח שהדפים
# שנבנו מראש ימשיכו להיות מוגשים כמו שהם — עם ה-HTML שלהם, שזה מה
# שמנועי חיפוש ורשתות חברתיות קוראים.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
  force = false

# ⚠️ הכותרות למטה אינן קישוט. האתר מדבר עם סופהבייס ועם ג'מיני דרכה,
# ומדיניות תוכן רחבה מדי היא בדיוק מה שהופך דף סטטי לנקודת הזרקה.
[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    # ⚠️ אין לנו iframe ואיננו רוצים שיטמיעו אותנו באחד.
    X-Frame-Options = "DENY"
    # ההרשאות שהדפדפן ייתן לדף. אנחנו לא מבקשים אף אחת מהן היום —
    # וכשגוגל מפות ייכנס, `geolocation` יידרש כאן במפורש. עדיף לפתוח
    # אותו במודע מאשר לגלות שהוא היה פתוח כל הזמן.
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"

# הנכסים נושאים חתימה בשם הקובץ, ולכן אפשר לשמור אותם לנצח.
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# ⚠️ תמונות הפארקים **אינן** נושאות חתימה — הן נקראות לפי slug קבוע.
# שנה, ואז תמונה שהוחלפה לא הייתה מגיעה לאיש. יום, וזה מספיק.
[[headers]]
  for = "/parks/*"
  [headers.values]
    Cache-Control = "public, max-age=86400"
